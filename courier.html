<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>কুরিয়ার সার্ভিস এড করার ফর্ম — MEHEDI Fashion MART</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f2;color:#202420;font-family:"Noto Sans Bengali","Segoe UI",Arial,sans-serif}
.header{background:#075b35;color:#fff;padding:14px 5%;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:Georgia,serif;font-size:25px;font-weight:700;color:#fff}.logo span{color:#d6b35b}
.nav{background:#8fbd55;padding:9px 5%;display:flex;gap:10px;flex-wrap:wrap}
.nav a{text-decoration:none;color:#12351f;font-weight:700;background:#fff;padding:7px 12px;border-radius:4px}
.wrap{max-width:850px;margin:25px auto;padding:0 15px}
.card{background:#fff;border:1px solid #d9ddd8;border-radius:9px;padding:22px;box-shadow:0 3px 12px #00000012}
h1{margin-top:0;color:#075b35}h2{font-size:19px;color:#075b35;border-bottom:1px solid #ddd;padding-bottom:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.full{grid-column:1/-1}
label{font-weight:700;font-size:14px}input,select,textarea{width:100%;padding:10px;margin-top:5px;border:1px solid #cdd4cc;border-radius:5px;font:inherit}textarea{min-height:90px;resize:vertical}
.btn{background:#075b35;color:#fff;border:0;padding:11px 18px;border-radius:5px;font-weight:800;cursor:pointer;margin-top:15px}
.btn.alt{background:#d6b35b;color:#16301e}.notice{padding:11px;background:#edf5e8;border-left:4px solid #075b35;margin:12px 0}
@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body>
<header class="header"><div class="logo">MEHEDI <span>Fashion</span> MART</div><div>🛍 Online Fashion Store</div></header>
<nav class="nav"><a href="index.html">🏠 হোম</a><a href="product-add.html">➕ পণ্য এড</a><a href="order.html">🛒 অর্ডার</a><a href="payment.html">💳 পেমেন্ট</a><a href="account.html">👤 একাউন্ট</a><a href="courier.html">🚚 কুরিয়ার</a></nav>
<div class="wrap"><div class="card"><h1>কুরিয়ার সার্ভিস এড করার ফর্ম</h1>

<div class="notice">Admin এখান থেকে নতুন courier service যোগ করতে পারবেন।</div>
<form onsubmit="event.preventDefault();done('কুরিয়ার সার্ভিস সফলভাবে যোগ করার ডেমো সম্পন্ন হয়েছে।')">
<div class="grid">
<div><label>কুরিয়ার কোম্পানির নাম</label><input required placeholder="যেমন: Steadfast"></div>
<div><label>কোম্পানি কোড</label><input placeholder="STEADFAST"></div>
<div><label>ঢাকার ভিতরে ডেলিভারি চার্জ</label><input type="number" placeholder="৳"></div>
<div><label>ঢাকার বাইরে ডেলিভারি চার্জ</label><input type="number" placeholder="৳"></div>
<div><label>COD চার্জ (%)</label><input type="number" step="0.01" placeholder="1"></div>
<div><label>Tracking URL</label><input placeholder="https://..."></div>
<div class="full"><label>API Key (যদি থাকে)</label><input type="password" placeholder="নিরাপদভাবে server-side রাখতে হবে"></div>
<div class="full"><label>সার্ভিসের বিবরণ</label><textarea></textarea></div>
</div><button class="btn">কুরিয়ার সংরক্ষণ করুন</button>
</form></div></div>
<script>
function done(msg){localStorage.setItem("mehedi_last_action",msg);alert(msg);}
</script></body></html>
